<!DOCTYPE html>
<html lang="en">
<style type="text/css">
    body {
        background-color: #3FBA54
    }
</style>

<head>
    <title>mope.io</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Survive and climb the food chain in mopeio, the hit browser game!">
    <meta name="keywords" content="mope, mope.io, mopeio,io games, .io, spaceships, browser game, html game, html5 game, agario, diepio, flash game, space, multiplayer">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">

    <meta property="og:image" content="http://mope.io/img/banner.jpg">
    <meta property="og:image:type" content="image/jpg">
    <meta property="og:image:width" content="1263">
    <meta property="og:image:height" content="707">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="index, follow">
    <meta name="revisit-after" content="3 days">
    <meta name="googlebot" content="all">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <!-- CSS -->
    <link rel="stylesheet" href="main.css" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <!-- Audio -->
    <audio id="spawn_cell" src="audio/click.mp3"></audio>
</head>

<body>
    <div id="gameAreaWrapper">
        <input id="chatinput" type="text" class="chat-input" placeholder="Chat here..." maxlength="35" />
        <canvas tabindex="1" id="gCanvas"></canvas>
    </div>
    <div id="connecting">
        <p id="desc">Connecting...</p>
        <div class="spinner">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
    </div>
    <div id="startMenuWrapper">
        <div id="startMenu">
            <div id="nickInputContainer" style="display: block;">
                <input id="nickInput" autofocus placeholder="Your name" maxlength="15" style="width: 100%; height: 40px; line-height: 36px;">
            </div>
            <select id="serverSelect">
            </select>
            <a>
                <button id="startButton">Play</button>
            </a>

            <div id="adsenseAd">
                <script async src="//pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
                <!-- mope.io Large Rectangle -->
                <ins class="adsbygoogle" style="display:inline-block;width:336px;height:280px" data-ad-client="ca-pub-9141569329288428" data-ad-slot="2596810245"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

        </div>
        <div id="socialButs">
            <div id="twitBut">
                <!-- twitter share button -->
                <a href="https://twitter.com/share" class="twitter-share-button" data-text="Check out mope.io, this awesome little game..." data-url="http://mope.io" data-show-count="true"></a>
                <script async src="//platform.twitter.com/widgets.js" charset="utf-8"></script>
            </div>
            <div id="fbButton">
                <!-- fb share button -->
                <div class="fb-like" data-href="https://facebook.com/mopeio" data-layout="button_count" data-action="like" data-show-faces="false" data-share="true"></div>
            </div>
        </div>
        <div id="feedBLink">
            <p>
                Leave game suggestions on the
                <a href="https://www.reddit.com/r/mopeio/comments/56a1kc/mopeio_feedbacksuggestions_thread_post_here/" target="_blank">Reddit</a> -----
                <a href="http://www.iogames.space" target="_blank">MORE GAMES</a> ---
            </p>
        </div>

    </div>


    </div>
    <!-- JS -->
    <script src="client.js"></script>
    <!-- google analytics -->
    <script>
        (function(i, s, o, g, r, a, m) {
            i['GoogleAnalyticsObject'] = r;
            i[r] = i[r] || function() {
                (i[r].q = i[r].q || []).push(arguments)
            }, i[r].l = 1 * new Date();
            a = s.createElement(o),
                m = s.getElementsByTagName(o)[0];
            a.async = 1;
            a.src = g;
            m.parentNode.insertBefore(a, m)
        })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

        ga('create', 'UA-36494583-11', 'auto');
        ga('send', 'pageview');
    </script>

    <!-- facebook SDK -->
    <div id="fb-root"></div>
    <script>
        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s);
            js.id = id;
            js.src = "//connect.facebook.net/en_US/sdk.js#xfbml=1&version=v2.7";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));
    </script>
</body>
